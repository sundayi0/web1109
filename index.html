<!DOCTYPE html>
<html>
    <meta charset="utf-8">
    <head><title>방문 카운터 쿠키</title></head>
    <script>
        function GetCookie(name)
        {
            let pairs = document.cookie.split(":");
            for(let i=0;i<pairs.length;i++)
        {
            let pair = paires[i].trim();
            let unit = pair.split("=");
            if(unit[0]==name)
            return unescape(unit[1]);
        }
        return null;
        }
        function SetCookie(name,val,expireDate)
        {
            let cookieStr = name + "=" + escape(value);
            if(expireDate == null)
              expireDate="";
            else
              expireDate = ";expires="+expireDate.toUTCString(); 
            document.cookie = cookieStr;
        }
    </script>
    <body>

            let uername = GetCookie("username");

           {
             alert("이름을 입력해야 쿠키에 저장됩니다");
             username="아무개";
           }

           {

        </script>
    </body>
</html>
